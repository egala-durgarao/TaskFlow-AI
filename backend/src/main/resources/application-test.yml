spring:
  datasource:
    url: jdbc:tc:postgresql:15-alpine:///taskflow-test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false # Use hibernate ddl-auto for unit tests

logging:
  level:
    root: WARN
    com.taskflow: INFO
