version: '3.8'

services:
  taskflow-db:
    image: postgres:15-alpine
    container_name: taskflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: taskflow
    ports:
      - "5432:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  taskflow-backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskflow-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://taskflow-db:5432/taskflow
      DB_USER: postgres
      DB_PASS: password
      JWT_SECRET: production_secret_must_be_overridden_in_real_env
    depends_on:
      taskflow-db:
        condition: service_healthy

  # Redis is disabled for Phase 1. Will be enabled in Phase 19.
  # taskflow-redis:
  #   image: redis:7-alpine
  #   container_name: taskflow-redis
  #   ports:
  #     - "6379:6379"

volumes:
  taskflow-db-data:
